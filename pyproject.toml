[project]
name = "seamlis"
version = "0.1.0"
description = "Safe exploration and mapping framework."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy==1.26.4",
    "scipy",
    "matplotlib",
    "cvxpy",
    "casadi",
    "do-mpc[full]>=5.1.1",
    "shapely>=2.0.7",
    "gurobipy",
    "scikit-fmm",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = ["exploration"]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "algorithms*"]
namespaces = true

[tool.uv]
dev-dependencies = []
